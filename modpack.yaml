# Valheim modpack — every mod here is BUILT FROM SOURCE in this repo, not
# downloaded from Thunderstore at deploy time (see SETUP.md part 3/4). The
# only Thunderstore download left anywhere in this pack is BepInEx itself,
# pulled by windows-installer/install.ps1 -- that's the mod loader
# (infrastructure), not one of this pack's own mods.
#
# 2026-09-09: switched from "download pinned Thunderstore releases" to
# "vendor the source and build it ourselves" on request -- the goal being
# full ownership of the codebase, no waiting on upstream authors to fix
# something. Each mod below was vendored from its own GitHub repo under
# its own license (recorded per-entry); `install_mods.py` is no longer
# part of the deploy path and is kept only as a historical fallback if a
# *future* mod gets added before it's vendored (see its own header comment).
#
# Upgrade workflow now: pull the upstream repo's latest source, re-apply
# whatever local patches this file documents per-mod (BCL/game-API fixes,
# stripped optional integrations), rebuild, redeploy. See SETUP.md part 3.

last_checked: 2026-09-10
game_version_target: 1.0  # Deep North launch

# The base game (not just mods) is pinned too, deliberately not
# auto-updating -- see docker-compose.yml's UPDATE_CRON comment and
# scripts/update-server-game.sh. Steam's client depot (892970) and
# dedicated-server depot (896660) are pushed independently and can drift
# out of sync for hours-to-a-day after a launch; discovered this the hard
# way on 2026-09-10 when a client auto-updated to network version 39 while
# the server was still on 36 ("Network version check, their:39, mine:36" in
# the server log, "Incompatible version" on the client) -- not a mod issue,
# not fixable from our side, just Iron Gate not having pushed the matching
# server build yet. Update deliberately with the script above once one's
# actually available, not by polling in a live session.
pinned_server_buildid: 25253791  # depot 896660, as of 2026-09-11 -- updated via
# scripts/update-server-game.sh; server's own reported network version is
# still 36 even on this newest available server-depot build, vs. the client's
# network version 40 (Valheim l-0.221.12/1.0.12) -- Iron Gate's server depot
# hasn't caught up yet. Not fixable from our side; re-check periodically.

mods:
  - namespace: Azumatt
    name: AzuCraftyBoxes
    pinned: 1.8.15  # source vendored at this tag
    source: https://github.com/AzumattDev/AzuCraftyBoxes
    license: MIT-0
    vendored_at: AzuCraftyBoxes-source/
    why: Craft using materials from nearby containers, not just inventory
    stripped: >
      Upstream also integrates with EpicLoot, WardIsLove, Backpacks,
      GemBags (Jewelcrafting), and kg/mkz ItemDrawers -- none of those mods
      run in this pack, so all of it was stripped (Compatibility/ folder,
      the optional IContainers implementations, and their bundled
      third-party API DLLs) rather than vendoring four more dependency
      chains for integrations nothing here uses.
    build_fixes: >
      netstandard2.1-vs-net472 BCL gaps only, no game-API breaks:
      Dictionary.TryAdd isn't in classic .NET Framework (SmelterPatches.cs,
      2 call sites, replaced with ContainsKey+indexer). Texture2D.LoadImage
      (UnityEngine.ImageConversionModule) hit a netstandard 2.0-vs-2.1
      reference-resolution conflict not worth chasing for one decorative
      status-effect icon -- stubbed to return no icon
      (Patches/SE_ContainerPull.cs), the status effect itself still works.
      2026-09-10: found live, connecting a real client -- upstream ships
      TWO independent version-check systems: the working ConfigSync one
      (used for config sync, passes fine) and a second, older, hand-rolled
      one (VersionHandshake.cs, a custom "{mod}_VersionCheck" RPC) that was
      actively broken -- the client-side reply never reached the server,
      which timed out and disconnected every connection attempt with a
      bare "Incompatible version" (no detail, unlike ConfigSync's own
      clear message). Root-caused by reading the server log's exact RPC
      exchange, not guessed. Removed VersionHandshake.cs entirely --
      ConfigSync's own ModRequired/MinimumRequiredVersion already covers
      this job correctly and was already proven working in the same
      connection attempt.

# Server-side character storage: previously Smoothbrain/ServerCharacters,
# REMOVED because its source has no license on GitHub -- couldn't legally
# vendor it. Reimplemented from scratch as part of ValheimQoL instead (see
# custom_plugins below) rather than continuing to depend on an unlicensed
# external mod. Retired from the server 2026-09-09; ValheimQoL's own
# version defaults OFF until a live connect/save/reconnect round-trip is
# verified -- see ValheimQoL's `server_character_storage` entry below.

# Client-only mods -- bundled into windows-installer/plugins/ for players,
# never copied to the gameserver's plugin folder (a headless server never
# renders a GUI, so these would be dead weight there).
client_only_mods:
  - namespace: Advize
    name: PlantEasily
    pinned: 2.1.1  # source vendored at this commit (monorepo, no per-mod tags)
    source: https://github.com/AdvizeGH/Advize_ValheimMods (Advize_PlantEasily/ subfolder)
    license: GPL-3.0
    vendored_at: PlantEasily-source/
    why: >
      Snaps crops into evenly-spaced rows/columns with the cultivator and
      blocks invalid overlapping placement. Same author as the
      since-removed PlantEverything.
      Client-only per its own boot log: "This mod is client-side only and
      is not needed on a dedicated server" -- installed to the server
      once by mistake, moved here and pulled back off the server the same
      day. All its snapping logic is local placement-preview UI; nothing
      for a headless server to simulate.
    build_fixes: >
      Piece.SetCreator(long, PlatformUserID) -- two-param, matching
      Player.PlacePiece's own call. An earlier post-1.0-launch build had
      briefly dropped to SetCreator(long) after a hotfix removed the
      second param; a later hotfix restored it. Confirmed against a fresh
      decompile each time rather than assumed -- Iron Gate's post-launch
      API surface has moved more than once. Core/PlacementController.cs
      line ~107.

  - namespace: shudnal
    name: ConfigurationManager
    pinned: 1.1.17  # source vendored at master HEAD as of 2026-09-09 (no version-matching git tags upstream)
    source: https://github.com/shudnal/ConfigurationManager
    license: LGPL-3.0
    vendored_at: ConfigurationManager-source/
    why: >
      In-game hotkey opens a window listing every loaded mod's BepInEx
      Config.Bind settings (ours and everyone else's) for live editing —
      no need to hand-edit .cfg files. This fork specifically adds a
      config-files editor, split view, and highlights values changed from
      default, which is exactly the "what have I tuned, ready to push to
      the server" workflow this is for.
    stripped: >
      Upstream also integrates with shudnal/ConditionalConfigSync (a
      fourth external dependency, Unlicense) purely for an optional
      lock-icon tooltip distinguishing "conditionally" vs "always"
      server-controlled settings -- dropped rather than vendoring a
      fourth project for that. Plain ServerSync detection (recognizes any
      ServerSync-based config by type name via reflection, including our
      own vendored ConfigSync.cs) is untouched and still works -- see
      ConfigSynchronizationInfo.cs for exactly what was removed. The
      `[BepInDependency("_shudnal.ConditionalConfigSync", ...)]` hard
      dependency that came with it was removed too, so this plugin
      doesn't refuse to load without that mod installed.
    build_fixes: >
      One real Valheim 1.0 API break: InventoryGrid.OnLeftDown/OnRightDown
      (used to Harmony-patch input-blocking while the config window is
      open) don't exist under those names -- verified by decompile, the
      real members are OnLeftClick/OnRightClick. Swapped in
      ValheimConfigurationManager.cs. Also two net472-BCL gaps unrelated
      to the game (string.StartsWith(char) isn't in classic .NET
      Framework, 6 call sites switched to the string-literal overload).

excluded:
  - namespace: Smoothbrain
    name: Jewelcrafting
    considered_version: 2.0.1
    reason: >
      BepInEx hard-refuses to load it: "Could not load [Jewelcrafting 2.0.1]
      because it is incompatible with: randyknapp.mods.epicloot" — Jewelcrafting
      declares itself explicitly incompatible with the installed EpicLoot.
      Chose to keep EpicLoot (broader QoL/loot system, more other mods
      depend on it) over Jewelcrafting. Re-evaluate if Jewelcrafting ships
      a version that declares compatibility with a current EpicLoot again.
      STALE as of 2026-09-09: EpicLoot itself was removed from the pack in
      the 1.0 restart, so this specific incompatibility no longer applies.
      Left here as history, not re-evaluated — nobody asked for Jewelcrafting
      back, this just isn't a real blocker anymore if someone does.

  - namespace: Xutz
    name: ValheimCuisine
    considered_version: 2.2.8
    reason: >
      Ships a large asset bundle (200+ recipe icons/models). User reported
      noticeable slowdown opening the ConfigurationManager window with it
      installed, and it was the heaviest asset payload in the pack for a
      feature (extra cooking recipes) nobody was relying on. Removed from
      both server and client.

# The BepInExPack itself is provided by the
# community-valheim-tools/valheim-server-docker image directly
# (BEPINEX=true) and is intentionally not managed here — the image
# auto-updates it, confirmed it's already on a Unity-6-compatible build
# (5.4.2333+) as of the 1.0 launch.

custom_plugins:
  # Hand-written, NOT from Thunderstore — source lives at
  # ValheimQoL-source/ in this repo (originally developed on a Linux
  # machine, now built on Windows -- see SETUP.md).
  # Deploy by building (`dotnet build -c Release`) and scp-ing
  # bin/Release/ValheimQoL.dll to config/bepinex/plugins/richard-ValheimQoL/
  # AND data/bepinex/BepInEx/plugins/richard-ValheimQoL/ on the gameserver
  # (two separate live copies when BEPINEX=true -- see SETUP.md gotchas),
  # then `docker compose restart`.
  - name: ValheimQoL
    version: 0.10.0
    purpose: >
      Recreates most of the original Valheim Plus feature set as standalone
      Harmony patches, verified against decompiled assembly_valheim.dll
      (ilspycmd) rather than guessed from memory — Valheim's internal APIs
      aren't stable enough to hand-wave.
    config_sync: >
      0.8.0: every config entry is now wrapped in ServerSync's ConfigSync
      (vendored as ConfigSync.cs -- same library AzuCraftyBoxes and
      ServerCharacters already use, confirmed by their own "ConfigSync RPC
      registered" boot log lines). The server pushes its live config to any
      connecting client automatically -- no more manually distributing a
      matching .cfg file, no more drift between server and client installs.
      ModRequired flipped to true in 0.8.1 (on request): a client without
      ValheimQoL now gets disconnected the same way a missing
      ServerCharacters install used to, rather than silently connecting
      without the QoL effects. Requires Unity.TextMeshPro.dll as a new build reference
      (libs/Unity.TextMeshPro.dll, pulled from the server's own Managed
      folder) -- ConfigSync's lock-icon UI code references TMP_Text even
      though a headless server never draws it.
    verified_against_1_0: >
      2026-09-09: every field/method touched by every patch below (13 of
      them, pre-1.0) was re-verified by decompiling the 1.0/Deep North
      build's assembly_valheim.dll (buildid 25185644, pulled straight from
      the gameserver's own install) — all still exist under the same names
      and signatures. No breakage found; nothing needed fixing for 1.0.
    features:
      - "AutoPickupRange -- overrides Player.m_autoPickupRange (vanilla already has auto-pickup; default 2m, deployed at 4m)"
      - "StaminaUseMultiplier -- Prefix on Player.UseStamina(float v), scales every stamina cost (build/run/jump/attack/dodge/swim) uniformly (deployed at 0.75)"
      - "FreeBuildToolStamina -- NEW in 0.9.0. Prefix on private Player.GetBuildStamina(), the single choke point hammer/hoe/cultivator all read their cost from (GetRightItem().m_shared.m_attack.m_attackStamina) via TryPlacePiece/RemovePiece/repair -- short-circuits it to return 0, zeroing stamina cost for exactly those three tools without touching combat/run/jump/dodge/swim (StaminaUseMultiplier above still applies to those normally) (deployed: true, on request)"
      - "MaxCarryWeightMultiplier -- Postfix on Player.Awake, scales Player.m_maxCarryWeight (vanilla base 300); food/potion carry bonuses from m_seman.ModifyMaxCarryWeight still stack on top normally (deployed at 1.5x)"
      - "FoodBuffsDontDecay -- Postfix on Player.UpdateFood, resets each active food's m_health/m_stamina/m_eitr to full value every tick instead of vanilla's (time-remaining/burn-time)^0.3 falloff curve, then reapplies totals via public SetMaxHealth/SetMaxStamina + private SetMaxEitr (via Traverse). Full benefit for the entire duration, cuts off only at expiry instead of tapering (deployed: true)"
      - "AutoEquipShieldWithOneHandedWeapon -- Postfix on Humanoid.EquipItem, restricted to Player (AI humanoids share this method). If the equipped item is ItemType.OneHandedWeapon (always lands in the right hand, confirmed in EquipItem's own branching) and the left hand is empty, auto-equips a Shield from inventory. Naturally non-recursive: the shield's own re-entrant EquipItem call is ItemType.Shield, which doesn't match the guard (deployed: true)"
      - "CameraFov / CameraMaxZoom -- Postfix on GameCamera.Awake, overrides m_fov (65) and m_maxDistance (6). CLIENT-ONLY, a headless server never instantiates GameCamera, unverified until someone actually plays (deployed at 65 / 8, mild)"
      - "BuildRotationDegrees -- Postfix on Player.Awake, reflects into private m_placeRotationDegrees (vanilla 22.5deg = 16 steps/circle) for finer placement rotation (deployed at 11.25deg = 32 steps/circle)"
      - "StackSizeMultiplier -- Postfix on ZNetScene.Awake, walks m_prefabs multiplying ItemDrop.ItemData.SharedData.m_maxStackSize for every stackable item (bumped 2x -> 3x for the 1.0 restart, on request)"
      - "WorkbenchRangeMultiplier / IgnoreRoofRequirement -- same ZNetScene.Awake walk, tweaks CraftingStation.m_rangeBuild/m_discoverRange and m_craftRequireRoof (range bumped 1.5x -> 2x; roof requirement now DEFAULT-ON for the 1.0 restart, on request -- was opt-in before)"
      - "ProductionSpeedMultiplier / ProductionCapacityMultiplier -- same walk, tweaks Smelter (m_secPerProduct/m_maxOre/m_maxFuel), Fermenter (m_fermentationDuration), Beehive (m_secPerUnit/m_maxHoney), CookingStation (m_secPerFuel) -- covers kiln/furnace/blast furnace/fermenter/beehive/cooking station from V+'s Crafting & Production section (deployed at 0.75x time / 1.5x capacity). Windmill has no equivalent production-rate field in this game version -- skipped, not a gap in the patch, a gap in what the game exposes."
      - "FireplaceInfiniteFuel -- NEW in 0.7.1. Postfix on Fireplace.Awake, sets Fireplace.m_infiniteFuel = true. Matches Valheim Plus's [FireSource] torches/fires toggle exactly -- fire sources never consume fuel at all, no chests needed (deployed: true, default-on)"
      - "FireplaceAutoRefuelEnabled/Range/Interval -- attaches a MonoBehaviour to every Fireplace instance (Postfix on Fireplace.Awake) that periodically Physics.OverlapSphere-scans for nearby Container inventories holding the fireplace's fuel item and calls the game's own public Fireplace.AddFuel(1f) (which already no-ops when full, so no risk of wasting fuel) -- now DEFAULT-ON for the 1.0 restart, on request (was opt-in before). Its own TryRefuel already no-ops once a fireplace has infinite fuel, so this and FireplaceInfiniteFuel don't conflict when both are on -- kept as a fallback for anyone who turns InfiniteFuel off but still wants convenience."
      - "BuildingIgnoreSupport / BuildingIgnoreWeatherDecay -- same walk, tweaks WearNTear.m_noSupportWear/m_noRoofWear (both left off/vanilla -- opt-in, not defaulted on)"
      - "GatheringYieldMultiplier -- same walk, scales DropTable.m_dropMin/Max on TreeBase.m_dropWhenDestroyed and MineRock/MineRock5.m_dropItems, plus Pickable.m_amount directly (deployed at 1.25x)"
      - "InventoryFillFirstSlot -- Postfix on private Inventory.TopFirst(item), forces first-slot placement for all items when enabled (off by default -- vanilla per-item-type placement is intentional in a lot of cases)"
      - "TamedPetsCantDie -- Prefix on Character.Damage(HitData), if the target is a tamed Tameable and the incoming hit would be lethal, scales the hit down via HitData.ApplyModifier() to leave exactly 1 HP -- off by default, opt-in"
      - "WagonBaseMassMultiplier / WagonItemWeightMultiplier -- Postfix on Vagon.Awake, scales m_baseMass/m_itemWeightMassFactor (deployed at 1x / 0.75x -- cargo weighs carts down 25% less)"
      - "DifficultyDamageScalePerPlayer / HealthScalePerPlayer / MaxScalingPlayers -- Postfix on Game.Awake, overrides the game's already-native player-count difficulty scaling fields directly (left at vanilla defaults 0.04 / 0.3 / 5 -- exposed for later tuning, not changed yet)"
      - "AllowOreThroughPortals -- same ZNetScene.Awake walk, sets ItemDrop.ItemData.SharedData.m_teleportable = true (vanilla blocks ore/metal from portal travel via this field). Code default is off; SERVER IS CURRENTLY RUNNING WITH THIS SET TO TRUE (deliberately enabled, deployed via server .cfg originally on 2026-08-22, carried forward into the 1.0 restart) -- local client's own .cfg is untouched and still defaults off"
      - "MapExploreRadiusMultiplier -- NEW in 0.7.0. Postfix on Minimap.Awake, scales Minimap.m_exploreRadius (vanilla 100) -- how much fog-of-war clears per step (deployed at 2x)"
      - "DisableScreenShake -- NEW in 0.7.0. Prefix on GameCamera.AddShake, short-circuits the whole method when enabled. Vanilla already has its own per-client toggle for this (m_cameraShakeEnabled, read from PlatformPrefs \"CameraShake\" in GameCamera.Awake) but that's each player's own Settings menu preference, not server-enforced -- this makes it consistent for everyone regardless of their own settings (deployed: true, default-on for the 1.0 restart, on request)"
      - "GuardianPowerCooldownMatchesDuration -- NEW, added 2026-09-11. Postfix on Player.ActivateGuardianPower, overwrites m_guardianPowerCooldown (vanilla's long real cooldown, read from the equipped power's own StatusEffect.m_cooldown) with that same StatusEffect's m_ttl (its active duration) -- so a boss power is usable again the instant its effect ends. Reads whichever power is currently equipped generically (Player.m_guardianSE, private -- AccessTools.FieldRefAccess), no per-boss name list needed, works for Eikthyr/Elder/Bonemass/Moder/Yagluth/Queen/Fader alike. Default on."
    server_character_storage: >
      NEW in 0.10.0 (ServerProfilePatch.cs). Replaces the removed
      ServerCharacters mod (see the "mods:" section above for why it was
      dropped) with an original implementation -- decompiling confirmed
      vanilla's PlayerProfile.Load/Save only ever touch the local .fch
      file (Game.SpawnPlayer -> PlayerProfile.LoadPlayerData is the one
      load chokepoint, Game.SavePlayerProfile the one save chokepoint),
      so there was no existing server-authoritative path to hook -- this
      adds a parallel one. Pull-based: on RPC_PeerInfo, the client
      registers a receiver then explicitly asks the server for its
      SteamID's stored blob (avoids racing an unregistered receiver the
      way an unprompted server push would); the server replies with
      whatever it has on disk, or "no data" for a new player, in which
      case the client just keeps using its local file same as vanilla.
      Every local .fch save still happens first and is never skipped, so
      a network failure never loses local progress -- worst case is a
      missed sync, not lost data. Config: ServerCharacterStorageEnabled
      (Server - Character Storage section), default FALSE. Deliberately
      not defaulted on like everything else in this restart -- this is
      the one feature that touches real save data, and it hasn't had a
      live connect/save/reconnect round-trip tested yet (can't be done
      without an actual client connecting). Verified so far: builds
      clean, deploys clean, RPC registers clean in server logs
      ("Registered 'richard.serverprofile...'" -- not literally what's
      logged, check ServerProfilePatch.cs for the actual RPC names).
      NOT yet verified: an actual character actually round-tripping.
      Test before flipping this on for real play.
    config_file: config/bepinex/richard.valheimqol.cfg on the gameserver
    all_numeric_settings_have_slider_ranges: >
      Every float/int setting carries a BepInEx AcceptableValueRange so
      ConfigurationManager (see client_only_mods below) renders it as a
      slider instead of a text box. Confirmed via decompiling
      ConfigEntryBase/AcceptableValueRange: out-of-range values (e.g. from a
      hand-edited .cfg) get silently clamped to the nearest bound, not
      rejected -- safe against a bad push-config.sh push.
    verified: >
      Builds clean (0 warnings/errors) every revision so far. Loads clean
      under BepInEx at both default and deliberately-extreme stress values
      for every setting, restart-tested repeatedly including all toggles on
      simultaneously -- no exceptions. User playtested locally end-to-end
      (connected to the real server) and confirmed working: auto-pickup,
      stamina, camera FOV/zoom, build rotation, stack size, gathering
      yield, workbench range, production speed/capacity. NOT yet
      playtested: TamedPetsCantDie and Wagon mass multipliers (need a
      tamed animal / a built cart respectively -- not a bug, just not
      reached yet in the current world). AllowOreThroughPortals is new
      (added on request, 0.3.0) -- restart-stress-tested clean but not yet
      playtested with an actual portal.
    still_missing_from_v_plus: >
      Two categories deliberately deferred, different in kind from
      everything else here (UI work / new networking, not more Harmony
      field patches): HUD overlays (numeric stamina/skill-exp displays,
      in-game clock, crop-placement warnings — needs real Canvas/uGUI work,
      not just field tweaks) and shared map/position sync (server-wide
      player position sharing, collaborative fog-of-war — needs a new
      RPC/ZDO sync design, this doesn't exist natively to hook into like
      auto-pickup did). Flag if these are still wanted; they're a
      different-shaped task than the rest of this backlog.
